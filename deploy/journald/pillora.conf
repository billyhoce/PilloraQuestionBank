# Host journald settings for the API and worker container logs (journald log driver in
# deploy/docker-compose.prod.yml).
# Install: sudo mkdir -p /etc/systemd/journald.conf.d
#          sudo cp pillora.conf /etc/systemd/journald.conf.d/ && sudo systemctl restart systemd-journald
[Journal]
# Keep the journal on disk so logs survive a VM reboot, not just a container recreate.
Storage=persistent
# Cap the whole journal (oldest entries go first); a few months of history at current volume.
SystemMaxUse=2G
