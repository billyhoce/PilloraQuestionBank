services:
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/pillora-dev;
      exit 0;
      "

  # docker compose run --rm tesseract <image|list.txt> <outbase|stdout> [-l eng] [--dpi N] [pdf|hocr|tsv|txt]
  # ingestion/ is mounted at /work, so paths are given relative to ingestion/.
  # Built on demand (never started by `up`): `docker compose build tesseract`.
  tesseract:
    build: ingestion/docker/tesseract
    image: pillora-tesseract
    network_mode: none
    profiles: [tools]
    volumes:
      - ./ingestion:/work

volumes:
  minio_data:
