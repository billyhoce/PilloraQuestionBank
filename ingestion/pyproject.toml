[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "question-extractor"
version = "0.1.0"
description = "Locate individual exam questions in digital-text PDF papers"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "anthropic>=1.11",
    "opencv-python-headless>=4.11",
    "numpy",
]

[project.scripts]
question-extractor = "question_extractor.cli:main"
ingester = "ingester.cli:main"
pipeline = "pipeline.cli:main"

[tool.setuptools]
packages = ["question_extractor", "ingester", "pipeline", "pipeline.stages"]
